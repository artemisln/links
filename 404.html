<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-HJ7Y5JWZRQ"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-HJ7Y5JWZRQ');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Artemis Codes</title>
    <link rel="icon" href="img/favicon.svg" />
    <link rel="stylesheet" href="css/main.css" />
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Roboto', sans-serif;
            background-color: #0f172a;
            color: #cbd5e1;
            overflow-x: hidden;
        }
        
        .error-container {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
            margin: 0 auto;
            width: 100%;
            max-width: 100%;
        }
        
        .error-code {
            font-size: 8rem;
            font-weight: bold;
            color: #2dd4bf;
            margin: 0;
            line-height: 1;
        }
        
        .error-message {
            font-size: 1.5rem;
            color: #e2e8f0;
            margin: 1rem 0 2rem 0;
            max-width: 600px;
        }
        
        .error-description {
            color: #cbd5e1;
            margin-bottom: 3rem;
            max-width: 500px;
        }
        
        .back-links {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
            justify-content: center;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            padding: 0.75rem 1.5rem;
            background-color: rgba(45, 212, 191, 0.1);
            color: #2dd4bf;
            text-decoration: none;
            border-radius: 0.5rem;
            border: 1px solid rgba(45, 212, 191, 0.2);
            transition: all 0.2s ease;
        }
        
        .back-link:hover {
            background-color: rgba(45, 212, 191, 0.2);
            border-color: rgba(45, 212, 191, 0.4);
            transform: translateY(-2px);
        }
        
        .spotlight {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: radial-gradient(600px at 50% 50%, rgba(29, 78, 216, 0.15), transparent 80%);
            pointer-events: none;
            z-index: 1;
        }
        
        .content {
            position: relative;
            z-index: 2;
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>
    <div class="spotlight"></div>
    
    <div class="error-container content">
        <h1 class="error-code">404</h1>
        <h2 class="error-message">Page Not Found</h2>
        <p class="error-description">The page you're looking for doesn't exist. It might have been moved, deleted, or you entered the wrong URL.</p>
        
        <div class="back-links">
            <a href="/" class="back-link">← Back to Portfolio</a>
            <a href="/links/" class="back-link">View Links</a>
        </div>
    </div>
    
    <script>
        document.addEventListener('mousemove', (e) => {
            const spotlight = document.querySelector('.spotlight');
            if (spotlight) {
                const x = e.clientX;
                const y = e.clientY;
                spotlight.style.background = `radial-gradient(600px at ${x}px ${y}px, rgba(29, 78, 216, 0.15), transparent 80%)`;
            }
        });
    </script>
</body>
</html>
