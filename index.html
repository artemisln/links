<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artemis Codes | Links</title>
    <!-- Favicon -->
    <link rel="icon" href="favicon.svg" />
    <!-- Font Awesome icons -->
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.8.1/css/all.css">
    <!-- Core theme CSS -->
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
    <!-- Parallax Pixel Background Animation -->
    <section class="animated-background">
      <div id="stars1"></div>
      <div id="stars2"></div>
      <div id="stars3"></div>
    </section>
    <!-- End of Parallax Pixel Background Animation -->

    <a id="profilePicture" href="#popup">
      <img src="images/pfp.jpeg" alt="Profile Picture">
    </a>

    <div class="overlay" id="popup">
      <div class="popup">
        <div class="popup-photo">
          <a href="https://avatars0.githubusercontent.com/u/43749971" target="_blank">
            <img src="https://avatars0.githubusercontent.com/u/43749971" alt="Profile Picture">
          </a>
        </div>
        <div class="popup-quote">
          <!-- But... the sensation that I've lost something lingers for a longtime after I wake up. -->
        </div>
        <a class="popup-close" onclick="history.back()">&times;</a>
      </div>
    </div>

    <div id="userName">
      @artemis.codes
    </div>

    <div id="links">
      <a class="link" href="https://github.com/artemisln" target="_blank">
        <i class="fab fa-github">&nbsp;</i>Github
      </a>
      <a class="link" href="https://www.youtube.com/@artemiscodes" target="_blank">
        <i class="fab fa-youtube">&nbsp;</i>Youtube
      </a>
      <a class="link" href="https://www.linkedin.com/in/artemisln" target="_blank">
        <i class="fab fa-linkedin">&nbsp;</i>Linkedin
      </a>
      <a class="link" href="https://www.instagram.com/artemis.codes" target="_blank">
        <i class="fab fa-instagram">&nbsp;</i>Instagram
      </a>
      <a class="link" href="https://codingclub.di.uoa.gr/" target="_blank">
        <i class="fa fa-code">&nbsp;</i>Coding Club
      </a>
    </div>
    <div class="panellinies">
      <div class="regular-text">Δίνεις Πανελλήνιες;</div>
      <a class="school-button" href="javascript:void(0);" onclick="toggleDropdown()">
        Χρήσιμα αρχεία
      </a>
      <div id="dropdown" class="dropdown-content">
        <a class="link" href="https://drive.google.com/file/d/1I02ANmbcWZRxJML0IyruRHscmsn_HWQL/view?usp=sharing" target="_blank">Flashcards για οικονομικά, πληροφορική, μαθηματικά</a>
        <a class="link" href="https://drive.google.com/file/d/1Bl579iDyCKIOoOu6snhRgNLw1bmziMKm/view?usp=sharing" target="_blank">Θεωρία Πληροφορικής</a>
      </div>
      <a class="school-button" href="https://www.didactics.gr/a/2147956735/LP45vZZK" target="_blank">
        Κάνε εγγραφή στη Didactics
      </a>
    </div>
    <div id="hashtag">
      Don't stop learning
    </div>

    <script>
      function toggleDropdown() {
        var dropdown = document.getElementById("dropdown");
        if (dropdown.style.display === "block") {
          dropdown.style.display = "none";
        } else {
          dropdown.style.display = "block";
        }
      }
    </script>
  </body>
</html>
